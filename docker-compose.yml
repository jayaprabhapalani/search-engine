services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment: &common_env
      - HACKERNEWS_BASE_URL=${HACKERNEWS_BASE_URL}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SQL_ECHO=${SQL_ECHO}
      - LOG_LEVEL=${LOG_LEVEL}
      - INDEX_POLL_SECONDS=${INDEX_POLL_SECONDS}
      - REINDEX_COOLDOWN_SECONDS=${REINDEX_COOLDOWN_SECONDS}
    depends_on:
      - postgres
      - redis
    networks:
      - hn_network

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hn_network

  redis:
    image: redis:7
    networks:
      - hn_network

  celery_worker:
    build: .
    command: celery -A hn_search.celery_app worker --loglevel=info
    environment: *common_env
    depends_on:
      - postgres
      - redis
    networks:
      - hn_network

  celery_beat:
    build: .
    command: celery -A hn_search.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *common_env
    depends_on:
      - postgres
      - redis
    networks:
      - hn_network

  celery_embeddings:
    build: .
    command: celery -A hn_search.celery_app worker --loglevel=info -Q embeddings --concurrency=1 --prefetch-multiplier=1
    environment: *common_env
    depends_on:
      - postgres
      - redis
    networks:
      - hn_network

networks:
  hn_network:
    driver: bridge

volumes:
  postgres_data:
